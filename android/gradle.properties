org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flag aggiunti dal template Flutter 3.50 per AGP 9.
android.newDsl=false
android.builtInKotlin=false
# Su Windows, con il progetto su D: (worktree) e la pub cache su C:, la cache
# incrementale di Kotlin 2.4 fallisce ("Could not close incremental caches")
# nei plugin share_plus, file_picker, package_info_plus, shared_preferences.
kotlin.incremental=false
